<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#6F4E37" />
  <meta name="msapplication-TileColor" content="#6F4E37" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="apple-touch-icon" href="/logo192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/logo192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/logo512.png" />
  <meta name="description" content="Dr. Chai Cafe - Smart QR Table Ordering. Scan QR, browse menu, order instantly." />
  <title>Dr. Chai Cafe | QR Ordering</title>
</head>

<body>
  <div id="root">
    <style>
      .initial-splash { position:fixed;inset:0;background:#FAF6F0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99999; }
      .initial-splash img { width:120px;height:120px;object-fit:contain;border-radius:24px;animation:pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%{transform:scale(0.95);opacity:0.8} 50%{transform:scale(1.05);opacity:1} 100%{transform:scale(0.95);opacity:0.8} }
    </style>
    <div class="initial-splash"><img src="/logo192.png" alt="Dr. Chai Cafe" /></div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
